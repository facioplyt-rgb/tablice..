<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Tablic Informacyjnych PRO</title>
    
    <!-- Pobranie nowoczesnych czcionek -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=DotGothic16&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent-bus: #f59e0b;
            --accent-train: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
            margin: 0;
            min-height: 100vh;
        }

        h1 {
            margin: 0 0 30px 0;
            color: var(--text-main);
            font-size: 32px;
            font-weight: 800;
            text-align: center;
            letter-spacing: -1px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 900px;
        }

        .tab-btn {
            flex: 1;
            padding: 18px;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            background-color: var(--panel-bg);
            color: var(--text-muted);
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .tab-btn:hover {
            border-color: #475569;
            color: var(--text-main);
        }

        .tab-btn.active-bus {
            background-color: rgba(245, 158, 11, 0.1);
            color: var(--accent-bus);
            border-color: var(--accent-bus);
        }

        .tab-btn.active-train {
            background-color: rgba(2, 132, 199, 0.1);
            color: var(--text-main);
            border-color: var(--accent-train);
        }

        .sub-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 900px;
            flex-wrap: wrap;
        }

        .sub-tab-btn {
            flex: 1;
            min-width: 150px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            background-color: var(--panel-bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sub-tab-btn.active {
            background-color: var(--accent-bus);
            color: #fff;
            border-color: var(--accent-bus);
        }

        .controls-container {
            background-color: var(--panel-bg);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            margin-bottom: 30px;
            width: 100%;
            max-width: 900px;
            box-sizing: border-box;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="file"], textarea {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 100%;
            height: 50px;
            border-radius: 8px;
            cursor: pointer;
            background-color: var(--bg-color);
            padding: 4px;
        }

        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }

        textarea {
            resize: vertical;
            min-height: 80px;
            line-height: 1.5;
        }

        .section-title {
            grid-column: 1 / -1;
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-bus);
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        .sip-row {
            display: grid;
            grid-template-columns: 0.5fr 2fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        button.download-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 18px 24px;
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 25px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        button.download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
        }

        .canvas-container {
            width: 100%;
            max-width: 1000px;
            position: relative;
            cursor: pointer;
            display: flex;
            justify-content: center;
            margin-bottom: 50px;
        }

        .canvas-container::after {
            content: "Kliknij tablicę, aby zobaczyć podgląd w powiększeniu";
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 41, 59, 0.8);
            color: #cbd5e1;
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 20px;
            pointer-events: none;
            white-space: nowrap;
        }

        canvas {
            background-color: #000;
            border: 6px solid #0f172a;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            width: 100%;
            height: auto;
            display: block;
            transition: all 0.3s;
        }

        /* Modal podglądu */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(15, 23, 42, 0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            width: 100%;
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .close-modal {
            background: #ef4444;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            align-self: flex-end;
            transition: background 0.2s;
        }

        .close-modal:hover { background: #dc2626; }
    </style>
</head>
<body>

    <h1>Generator Tablic PRO</h1>

    <!-- Wybór głównego trybu -->
    <div class="tabs">
        <div class="tab-btn active-bus" id="btnBus" onclick="setMainMode('bus')">🚌 Autobus / Tramwaj</div>
        <div class="tab-btn" id="btnTrain" onclick="setMainMode('train')">🚆 Kolej (PKP)</div>
    </div>

    <!-- Podmenu dla Autobusu -->
    <div class="sub-tabs" id="subModeBus">
        <div class="sub-tab-btn active" id="btnBusDir" onclick="setSubMode('dir')">Kierunkowa Zewn. (LED)</div>
        <div class="sub-tab-btn" id="btnBusSip" onclick="setSubMode('sip')">Przystankowa (SIP)</div>
        <div class="sub-tab-btn" id="btnBusLcd" onclick="setSubMode('lcd')">Ekran Wewn. (LCD)</div>
    </div>

    <div class="controls-container">
        
        <!-- 1. TABLICA KIERUNKOWA POJAZDU (LED) -->
        <div id="controlsBusDir" class="controls-grid" style="display: none;">
            <div class="input-group">
                <label>Linia (max 4 znaki):</label>
                <input type="text" id="lineInput" value="123" maxlength="4">
            </div>
            <div class="input-group" style="grid-column: span 2;">
                <label>Kierunek (długi tekst się dostosuje):</label>
                <input type="text" id="destInputBus" value="DWORZEC GŁÓWNY - HALA">
            </div>
            <div class="input-group">
                <label>Kolor diod LED:</label>
                <input type="color" id="colorInput" value="#ff9900">
            </div>
        </div>

        <!-- 2. SYSTEM INFORMACJI DYNAMICZNEJ (SIP) -->
        <div id="controlsBusSip" class="controls-grid" style="display: none;">
            <div class="input-group" style="grid-column: span 2;">
                <label>Nazwa Przystanku:</label>
                <input type="text" id="sipStopName" value="Fieldorfa-Nila">
            </div>
            <div class="input-group">
                <label>Zegar:</label>
                <input type="text" id="sipTime" value="14:53">
            </div>
            <div class="input-group" style="grid-column: span 3;">
                <label>Logo/Herb miasta (zastąpi domyślny):</label>
                <input type="file" id="crestInput" accept="image/*">
            </div>
            
            <div class="section-title">Najbliższe odjazdy:</div>
            <div style="grid-column: 1 / -1;">
                <div class="sip-row">
                    <input type="text" id="sipL1" value="1" placeholder="Linia">
                    <input type="text" id="sipD1" value="Wieprzyce PKP" placeholder="Kierunek">
                    <input type="text" id="sipT1" value="3 min" placeholder="Czas">
                </div>
                <div class="sip-row">
                    <input type="text" id="sipL2" value="4" placeholder="Linia">
                    <input type="text" id="sipD2" value="Dworzec Główny" placeholder="Kierunek">
                    <input type="text" id="sipT2" value="7 min" placeholder="Czas">
                </div>
                <div class="sip-row">
                    <input type="text" id="sipL3" value="3" placeholder="Linia">
                    <input type="text" id="sipD3" value="Piaski" placeholder="Kierunek">
                    <input type="text" id="sipT3" value="12 min" placeholder="Czas">
                </div>
                <div class="sip-row">
                    <input type="text" id="sipL4" value="1" placeholder="Linia">
                    <input type="text" id="sipD4" value="Wieprzyce PKP" placeholder="Kierunek">
                    <input type="text" id="sipT4" value="15 min" placeholder="Czas">
                </div>
            </div>

            <div class="input-group" style="grid-column: span 3; margin-top: 10px;">
                <label>Pasek informacyjny (Dolny Ticker):</label>
                <input type="text" id="sipTicker" value="Jakość powietrza bardzo dobra =)">
            </div>
        </div>

        <!-- 3. EKRAN WEWNĘTRZNY LCD (NOWY) -->
        <div id="controlsBusLcd" class="controls-grid" style="display: none;">
            <div class="input-group">
                <label>Linia:</label>
                <input type="text" id="lcdLine" value="3">
            </div>
            <div class="input-group" style="grid-column: span 2;">
                <label>Kierunek (Prawy górny róg):</label>
                <input type="text" id="lcdDest" value="FIELDORFA NILA">
            </div>
            <div class="input-group" style="grid-column: span 3;">
                <label>Tekst na żółtym pasku (np. Przystanek):</label>
                <input type="text" id="lcdSubText" value="Przystanek: Piaski">
            </div>
            <div class="input-group" style="grid-column: span 2;">
                <label>Lista kolejnych przystanków (każdy w nowej linii):</label>
                <textarea id="lcdStops" rows="6">FIELDORFA NILA
OSIEDLE PIASKI
CHWALĘCICE
PUSZKINA
PLAC SŁONECZNY
ROOSEVELTA</textarea>
            </div>
            <div class="input-group">
                <label>Godzina:</label>
                <input type="text" id="lcdTime" value="5:38">
            </div>
            <div class="input-group" style="grid-column: span 3;">
                <label>Dolny pasek informacyjny:</label>
                <input type="text" id="lcdTicker" value="Strefa 1 | Bilet normalny: 3.00 zł">
            </div>
        </div>

        <!-- 4. TABLICA KOLEJOWA PKP -->
        <div id="controlsTrain" class="controls-grid" style="display: none;">
            <div class="input-group">
                <label>Godzina Odjazdu:</label>
                <input type="text" id="timeInput" value="16:45">
            </div>
            <div class="input-group" style="grid-column: span 2;">
                <label>Stacja docelowa:</label>
                <input type="text" id="destInputTrain" value="Warszawa Wschodnia">
            </div>
            <div class="input-group" style="grid-column: span 3;">
                <label>Stacje pośrednie (zostaną zgrabnie ułożone w wielu liniach):</label>
                <textarea id="viaInput">Kraków Główny, Miechów, Włoszczowa Północ, Opoczno Południe, Warszawa Zachodnia, Warszawa Centralna</textarea>
            </div>
            <div class="input-group">
                <label>Przewoźnik:</label>
                <input type="text" id="operatorInput" value="PKP Intercity">
            </div>
            <div class="input-group" style="grid-column: span 2;">
                <label>Kategoria i Nazwa pociągu:</label>
                <input type="text" id="trainNameInput" value="EIP 3104 (Pendolino)">
            </div>
        </div>

        <button class="download-btn" onclick="downloadImage()">Pobierz jako Plik PNG (Wysoka Jakość 8K)</button>
    </div>

    <!-- Płótna (Canvas) -->
    <div class="canvas-container" onclick="openModal()">
        <canvas id="boardCanvas"></canvas>
    </div>

    <div id="modalOverlay" class="modal-overlay" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeModal()">Zamknij Podgląd</button>
            <canvas id="modalCanvas"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('boardCanvas');
        const ctx = canvas.getContext('2d');
        const modalCanvas = document.getElementById('modalCanvas');
        const modalCtx = modalCanvas.getContext('2d');
        const modalOverlay = document.getElementById('modalOverlay');

        let currentMainMode = 'bus'; 
        let currentSubMode = 'dir'; 
        let customCrestImage = null; 
        let defaultCrestImage = null;

        // TWARDY LIMIT WYMIARU (Standardowe 8K UHD)
        const MAX_DIMENSION = 7680; 
        let currentScale = 1; 

        // Ładowanie obrazka użytkownika (nadpisze herb Gorzowa)
        document.getElementById('crestInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        customCrestImage = img;
                        drawBoard();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function setMainMode(mode) {
            currentMainMode = mode;
            document.getElementById('btnBus').className = mode === 'bus' ? 'tab-btn active-bus' : 'tab-btn';
            document.getElementById('btnTrain').className = mode === 'train' ? 'tab-btn active-train' : 'tab-btn';
            document.getElementById('subModeBus').style.display = mode === 'bus' ? 'flex' : 'none';
            // Default to first sub-mode when switching main modes
            if(mode === 'train') {
                updateUI();
            } else {
                setSubMode('dir');
            }
        }

        function setSubMode(mode) {
            currentSubMode = mode;
            document.getElementById('btnBusDir').className = mode === 'dir' ? 'sub-tab-btn active' : 'sub-tab-btn';
            document.getElementById('btnBusSip').className = mode === 'sip' ? 'sub-tab-btn active' : 'sub-tab-btn';
            document.getElementById('btnBusLcd').className = mode === 'lcd' ? 'sub-tab-btn active' : 'sub-tab-btn';
            updateUI();
        }

        function updateUI() {
            document.getElementById('controlsBusDir').style.display = 'none';
            document.getElementById('controlsBusSip').style.display = 'none';
            document.getElementById('controlsBusLcd').style.display = 'none';
            document.getElementById('controlsTrain').style.display = 'none';

            let targetRatio, w, h;

            if (currentMainMode === 'train') {
                document.getElementById('controlsTrain').style.display = 'grid';
                w = 1600; h = 600; targetRatio = "16 / 6";
            } else {
                if (currentSubMode === 'dir') {
                    document.getElementById('controlsBusDir').style.display = 'grid';
                    w = 1600; h = 300; targetRatio = "16 / 3";
                } else if (currentSubMode === 'sip') {
                    document.getElementById('controlsBusSip').style.display = 'grid';
                    w = 1600; h = 800; targetRatio = "2 / 1";
                } else if (currentSubMode === 'lcd') {
                    document.getElementById('controlsBusLcd').style.display = 'grid';
                    // Typowa rozdzielczość monitora (16:9)
                    w = 1920; h = 1080; targetRatio = "16 / 9";
                }
            }

            // --- TWARDE OGRANICZENIE DO MAX 7680px ---
            currentScale = Math.floor(MAX_DIMENSION / Math.max(w, h));
            if (currentScale < 1) currentScale = 1; 

            const finalWidth = w * currentScale;
            const finalHeight = h * currentScale;

            canvas.width = finalWidth; 
            canvas.height = finalHeight; 
            canvas.style.aspectRatio = targetRatio;
            
            modalCanvas.width = finalWidth; 
            modalCanvas.height = finalHeight; 
            modalCanvas.style.aspectRatio = targetRatio;

            canvas.logicalW = w; canvas.logicalH = h;
            modalCanvas.logicalW = w; modalCanvas.logicalH = h;
            
            drawBoard();
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split(/(?=[,\s])/); 
            let line = '';
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n];
                let metrics = context.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    context.fillText(line.trim(), x, y);
                    line = words[n];
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line.trim(), x, y);
        }

        function drawLEDGrid(targetCtx, w, h) {
            const step = 6; 
            targetCtx.shadowBlur = 0;
            targetCtx.lineWidth = 1.5;
            targetCtx.strokeStyle = 'rgba(0, 0, 0, 0.85)'; 
            
            targetCtx.beginPath();
            for (let x = 0; x <= w; x += step) {
                targetCtx.moveTo(x, 0);
                targetCtx.lineTo(x, h);
            }
            for (let y = 0; y <= h; y += step) {
                targetCtx.moveTo(0, y);
                targetCtx.lineTo(w, y);
            }
            targetCtx.stroke();
        }

        function drawToContext(targetCtx) {
            const width = targetCtx.canvas.logicalW;
            const height = targetCtx.canvas.logicalH;

            targetCtx.save();
            targetCtx.scale(currentScale, currentScale);

            if (currentMainMode === 'train') {
                // --- KOLEJ PKP ---
                targetCtx.fillStyle = '#1e5088'; 
                targetCtx.fillRect(0, 0, width, height);

                const leftPanelW = 350; 
                targetCtx.fillStyle = '#11355e';
                targetCtx.fillRect(0, 0, leftPanelW, height);
                
                targetCtx.fillStyle = '#ffffff';
                targetCtx.fillRect(leftPanelW, 20, 4, height - 40);
                targetCtx.textBaseline = 'top';

                targetCtx.font = 'bold 120px "Oswald", Arial, sans-serif';
                targetCtx.textAlign = 'center';
                targetCtx.fillText(document.getElementById('timeInput').value, leftPanelW / 2, 70);
                
                targetCtx.font = 'italic 20px "Oswald", Arial, sans-serif';
                targetCtx.fillText("Przewoźnik / Operator", leftPanelW / 2, 500);
                targetCtx.font = 'bold 30px "Oswald", Arial, sans-serif';
                targetCtx.fillText(document.getElementById('operatorInput').value, leftPanelW / 2, 530);

                targetCtx.textAlign = 'left';
                const paddingX = leftPanelW + 40;
                
                targetCtx.font = 'italic 24px "Oswald", Arial, sans-serif';
                targetCtx.fillText("Stacja docelowa / Destination:", paddingX, 40);
                
                targetCtx.font = 'bold 100px "Oswald", Arial, sans-serif';
                targetCtx.fillText(document.getElementById('destInputTrain').value, paddingX, 70);
                
                targetCtx.font = 'italic 24px "Oswald", Arial, sans-serif';
                targetCtx.fillText("Stacje pośrednie / Via stations:", paddingX, 210);
                
                targetCtx.font = 'bold 32px "Oswald", Arial, sans-serif';
                wrapText(targetCtx, document.getElementById('viaInput').value, paddingX, 250, width - paddingX - 40, 45);
                
                targetCtx.font = 'italic 24px "Oswald", Arial, sans-serif';
                targetCtx.fillText("Kategoria i Nazwa / Train Name", paddingX, 500);
                targetCtx.font = 'bold 35px "Oswald", Arial, sans-serif';
                targetCtx.fillText(document.getElementById('trainNameInput').value, paddingX, 530);

            } else if (currentSubMode === 'dir') {
                // --- AUTOBUS KIERUNKOWY LED ---
                const ledColor = document.getElementById('colorInput').value;
                targetCtx.fillStyle = '#050505'; 
                targetCtx.fillRect(0, 0, width, height);
                
                targetCtx.fillStyle = ledColor;
                targetCtx.globalAlpha = 0.05;
                targetCtx.fillRect(0, 0, width, height);
                targetCtx.globalAlpha = 1.0;

                targetCtx.fillStyle = ledColor;
                targetCtx.shadowColor = ledColor;
                targetCtx.shadowBlur = 25; 
                targetCtx.textBaseline = 'middle';
                
                targetCtx.font = 'bold 150px "DotGothic16", monospace';
                targetCtx.textAlign = 'center';
                targetCtx.fillText(document.getElementById('lineInput').value, 180, height / 2 + 5);
                
                targetCtx.font = '140px "DotGothic16", monospace';
                targetCtx.textAlign = 'left';
                targetCtx.fillText(document.getElementById('destInputBus').value.toUpperCase(), 380, height / 2 + 5, width - 420);

                drawLEDGrid(targetCtx, width, height);

            } else if (currentSubMode === 'sip') {
                // --- PRZYSTANEK (SIP) ---
                targetCtx.fillStyle = '#030303';
                targetCtx.fillRect(0, 0, width, height);
                targetCtx.textBaseline = 'top';
                targetCtx.shadowBlur = 0;

                const activeCrest = customCrestImage || defaultCrestImage; 
                
                if (activeCrest) {
                    targetCtx.drawImage(activeCrest, 40, 30, 90, 110);
                } else {
                    targetCtx.fillStyle = '#ffffff';
                    targetCtx.fillRect(40, 30, 90, 100);
                    targetCtx.fillStyle = '#e74c3c';
                    targetCtx.fillRect(55, 45, 60, 70);
                }

                const cyan = '#42cbf5';
                targetCtx.fillStyle = cyan;
                targetCtx.shadowColor = cyan;
                targetCtx.shadowBlur = 15;
                targetCtx.textAlign = 'center';
                targetCtx.font = '80px "DotGothic16", monospace';
                targetCtx.fillText(document.getElementById('sipStopName').value, width / 2, 40);

                const orange = '#ff9500';
                targetCtx.fillStyle = orange;
                targetCtx.shadowColor = orange;
                targetCtx.textAlign = 'right';
                targetCtx.font = '95px "DotGothic16", monospace';
                targetCtx.fillText(document.getElementById('sipTime').value, width - 40, 30);

                const headerCol = '#9dc6e8';
                targetCtx.fillStyle = headerCol;
                targetCtx.shadowColor = headerCol;
                targetCtx.font = '50px "DotGothic16", monospace';
                targetCtx.textAlign = 'left';
                targetCtx.fillText("Linia", 40, 170);
                targetCtx.fillText("Kierunek", 280, 170);
                targetCtx.textAlign = 'right';
                targetCtx.fillText("Odjazd", width - 40, 170);

                const yellow = '#ffcc00';
                targetCtx.fillStyle = yellow;
                targetCtx.shadowColor = yellow;
                targetCtx.font = '70px "DotGothic16", monospace';
                for (let i = 1; i <= 4; i++) {
                    let y = 160 + i * 90; 
                    targetCtx.textAlign = 'center';
                    targetCtx.fillText(document.getElementById('sipL'+i).value, 110, y);
                    targetCtx.textAlign = 'left';
                    targetCtx.fillText(document.getElementById('sipD'+i).value, 280, y);
                    targetCtx.textAlign = 'right';
                    targetCtx.fillText(document.getElementById('sipT'+i).value, width - 40, y);
                }

                const green = '#2ecc71';
                targetCtx.fillStyle = green;
                targetCtx.shadowColor = green;
                targetCtx.textAlign = 'center';
                targetCtx.font = '60px "DotGothic16", monospace';
                targetCtx.fillText(document.getElementById('sipTicker').value, width / 2, 700);

                drawLEDGrid(targetCtx, width, height);
                
            } else if (currentSubMode === 'lcd') {
                // --- EKRAN WEWNĘTRZNY LCD (TFT) 1:1 ze zdjeciem ---
                
                // Kolory wg referencji z podmianą różowego na szary
                const colorGray = '#5a626d';    // Nowoczesny szary
                const colorGrayDark = '#424a54';// Ciemniejszy dla kwadratu z linią
                const colorYellow = '#d4c94b';
                const colorBgBlue = '#b8e3ff';
                const colorTextTeal = '#1f6a73';

                // Tło główne
                targetCtx.fillStyle = colorBgBlue;
                targetCtx.fillRect(0, 0, width, height);

                // 1. Górny pasek (Kierunek) - zrobiony w odcieniach szarości
                targetCtx.fillStyle = colorGray;
                targetCtx.fillRect(0, 0, width, 140); // Zwężony do 140px (1:1 z proporcjami na zdjęciu)
                
                // Ciemniejszy kwadrat na numer linii na samej górze
                targetCtx.fillStyle = colorGrayDark;
                targetCtx.fillRect(0, 0, 220, 140);
                
                // Biała linia oddzielająca kwadrat linii od reszty nagłówka
                targetCtx.fillStyle = '#ffffff';
                targetCtx.fillRect(218, 0, 4, 140); 

                targetCtx.shadowBlur = 0; 
                targetCtx.textBaseline = 'middle';
                
                // Numer linii
                targetCtx.fillStyle = '#ffffff';
                targetCtx.textAlign = 'center';
                targetCtx.font = '900 100px "Inter", sans-serif';
                targetCtx.fillText(document.getElementById('lcdLine').value, 110, 75);
                
                // Kierunek (Wyśrodkowany względem pozostałego miejsca)
                targetCtx.textAlign = 'center';
                targetCtx.font = '900 85px "Inter", sans-serif';
                targetCtx.fillText(document.getElementById('lcdDest').value, 220 + (width - 220) / 2, 75);

                // 2. Żółty pasek z tekstem pod kierunkiem
                targetCtx.fillStyle = colorYellow;
                targetCtx.fillRect(0, 140, width, 55); 
                
                targetCtx.fillStyle = '#3a3a3a'; // Ciemny tekst na żółtym pasku dla czytelności (jak na zdjęciu)
                targetCtx.textAlign = 'left';
                targetCtx.font = 'bold 36px "Inter", sans-serif';
                targetCtx.fillText(document.getElementById('lcdSubText').value, 40, 170);

                // 3. Główna treść - termometr (trasa)
                const stopsText = document.getElementById('lcdStops').value;
                const stops = stopsText.split('\n').filter(s => s.trim() !== '');
                
                const lineX = 100; // Oś termometru
                const startY = 260; // Podniesiony nieco wyżej
                const stepY = 85;

                // Rysowanie pionowej linii trasy
                targetCtx.strokeStyle = colorTextTeal;
                targetCtx.lineWidth = 6;
                targetCtx.beginPath();
                targetCtx.moveTo(lineX, startY);
                if (stops.length > 1) {
                    targetCtx.lineTo(lineX, startY + (stops.length - 1) * stepY);
                }
                targetCtx.stroke();

                // Rysowanie kulek i nazw przystanków
                targetCtx.textAlign = 'left';
                for (let i = 0; i < stops.length; i++) {
                    const y = startY + i * stepY;
                    
                    targetCtx.fillStyle = colorTextTeal;
                    targetCtx.beginPath();
                    
                    if (i === 0) {
                        // Aktualny przystanek w formie zaokrąglonego kwadratu
                        targetCtx.rect(lineX - 12, y - 12, 24, 24);
                        targetCtx.fill();
                        targetCtx.font = '900 42px "Inter", sans-serif';
                    } else {
                        // Kolejne przystanki jako kreseczki na osi (jak w rzeczywistości)
                        targetCtx.fillRect(lineX - 10, y - 3, 20, 6);
                        targetCtx.font = '600 38px "Inter", sans-serif'; 
                    }
                    
                    // Strzałka przy pierwszym przystanku
                    if (i === 0) {
                        targetCtx.fillText("➤ " + stops[i], lineX + 30, y);
                    } else {
                        targetCtx.fillText(stops[i], lineX + 45, y);
                    }
                }

                // 4. Godzina (Duża, z prawej strony)
                targetCtx.fillStyle = colorTextTeal;
                targetCtx.textAlign = 'right';
                targetCtx.font = '900 160px "Inter", sans-serif';
                targetCtx.fillText(document.getElementById('lcdTime').value, width - 80, 420);

                // Logo/Herb w prawym dolnym rogu głównego ekranu
                const activeCrest = customCrestImage || defaultCrestImage; 
                if (activeCrest) {
                    targetCtx.drawImage(activeCrest, width - 260, height - 280, 170, 200);
                }

                // 5. Dolny pasek (Ticker) - Zmieniony na szary pasek z białym fontem
                targetCtx.fillStyle = colorGray;
                targetCtx.fillRect(0, height - 55, width, 55);
                
                targetCtx.fillStyle = '#ffffff';
                targetCtx.textAlign = 'center';
                targetCtx.font = 'bold 32px "Inter", sans-serif';
                targetCtx.fillText(document.getElementById('lcdTicker').value, width / 2, height - 26);
            }

            targetCtx.restore();
        }

        function drawBoard() {
            drawToContext(ctx);
            drawToContext(modalCtx);
        }

        const inputs = document.querySelectorAll('input, textarea');
        inputs.forEach(input => {
            if(input.type !== 'file') {
                input.addEventListener('input', drawBoard);
            }
        });

        function openModal() { modalOverlay.style.display = 'flex'; drawToContext(modalCtx); }
        function closeModal() { modalOverlay.style.display = 'none'; }

        function downloadImage() {
            canvas.toBlob(function(blob) {
                if (!blob) return alert("Błąd generowania obrazu.");
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                let fileName = "tablica_PRO.png";
                
                if (currentMainMode === 'train') {
                    const safeDest = document.getElementById('destInputTrain').value.replace(/[^a-zA-Z0-9]/g, '_');
                    fileName = `kolej_${safeDest}_8K.png`;
                } else if (currentSubMode === 'dir') {
                    const safeLine = document.getElementById('lineInput').value.replace(/[^a-zA-Z0-9]/g, '');
                    fileName = `autobus_zewn_${safeLine}_8K.png`;
                } else if (currentSubMode === 'sip') {
                    const safeStop = document.getElementById('sipStopName').value.replace(/[^a-zA-Z0-9]/g, '_');
                    fileName = `przystanek_${safeStop}_8K.png`;
                } else if (currentSubMode === 'lcd') {
                    const safeLcd = document.getElementById('lcdLine').value.replace(/[^a-zA-Z0-9]/g, '');
                    fileName = `autobus_wewn_LCD_${safeLcd}_8K.png`;
                }
                
                link.download = fileName;
                link.href = url;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            }, 'image/png');
        }

        // --- INICJALIZACJA APLIKACJI ---
        setMainMode('bus'); 
        
        const initDefaultCrest = new Image();
        initDefaultCrest.onload = function() {
            defaultCrestImage = initDefaultCrest;
            drawBoard();
        };
        initDefaultCrest.src = 'POL_Gorzów_Wielkopolski_COA.svg.webp';

        document.fonts.ready.then(drawBoard);
    </script>
</body>
</html>
