<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Generator Tablic Informacyjnych</title>
    <!-- Czcionka dla tablicy autobusowej -->
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            margin: 0;
            min-height: 100vh;
        }

        h1 {
            margin-top: 5px;
            color: #f1c40f;
            font-size: 24px;
            text-align: center;
        }

        /* --- WYBÓR TRYBU --- */
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
        }

        .mode-btn {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            background-color: #1e1e1e;
            color: #aaa;
            border: 2px solid #333;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-btn.active-bus {
            background-color: #d35400;
            color: white;
            border-color: #e67e22;
        }

        .mode-btn.active-train {
            background-color: #1e5088;
            color: white;
            border-color: #2b74c2;
        }

        /* --- KONTROLKI --- */
        .controls-container {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 120px;
            width: 100%;
        }

        label {
            font-size: 13px;
            font-weight: bold;
            color: #aaa;
        }

        input[type="text"], input[type="color"], textarea {
            background-color: #2c2c2c;
            color: white;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 5px;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }

        input[type="color"] {
            height: 45px;
            padding: 2px;
            cursor: pointer;
        }

        button.download-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-top: 15px;
        }

        button.download-btn:hover {
            background-color: #2ecc71;
        }

        /* --- PŁÓTNO (CANVAS) --- */
        .canvas-container {
            width: 100%;
            max-width: 900px;
            position: relative;
            cursor: pointer;
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .canvas-container::after {
            content: "Kliknij tablicę, aby powiększyć do zrzutu ekranu";
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            color: #ddd;
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 15px;
            pointer-events: none;
            white-space: nowrap;
        }

        canvas {
            background-color: #000;
            border: 4px solid #1a1a1a;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            width: 100%;
            height: auto;
            display: block;
            transition: aspect-ratio 0.3s;
        }

        /* --- MODAL --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
        }

        .modal-content {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .close-modal {
            background: #c0392b;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 15px;
            align-self: flex-end;
            width: auto;
        }
    </style>
</head>
<body>

    <h1>Generator Tablic Informacyjnych</h1>

    <!-- Przyciski wyboru trybu -->
    <div class="mode-selector">
        <div class="mode-btn active-bus" id="btnBus" onclick="setMode('bus')">🚌 Autobus (LED)</div>
        <div class="mode-btn" id="btnTrain" onclick="setMode('train')">🚆 Kolej (PKP)</div>
    </div>

    <!-- Kontrolki -->
    <div class="controls-container">
        
        <!-- Formularz Autobusowy -->
        <div id="controlsBus" class="controls">
            <div class="input-group">
                <label for="lineInput">Linia (max 3 cyfry):</label>
                <input type="text" id="lineInput" value="123" maxlength="3">
            </div>
            <div class="input-group" style="flex: 2;">
                <label for="destInputBus">Kierunek:</label>
                <input type="text" id="destInputBus" value="DWORZEC GŁÓWNY">
            </div>
            <div class="input-group" style="min-width: 60px; flex: 0.5;">
                <label for="colorInput">Kolor:</label>
                <input type="color" id="colorInput" value="#ff9900">
            </div>
        </div>

        <!-- Formularz Kolejowy -->
        <div id="controlsTrain" class="controls" style="display: none;">
            <div style="display: flex; gap: 15px; width: 100%;">
                <div class="input-group" style="flex: 1;">
                    <label for="timeInput">Godzina:</label>
                    <input type="text" id="timeInput" value="4:58">
                </div>
                <div class="input-group" style="flex: 3;">
                    <label for="destInputTrain">Stacja docelowa:</label>
                    <input type="text" id="destInputTrain" value="Szczecin Główny">
                </div>
            </div>
            <div class="input-group">
                <label for="viaInput">Stacje pośrednie (rozdzielone przecinkami):</label>
                <textarea id="viaInput">Sopot, Gdynia Główna, Rumia, Wejherowo, Lębork, Słupsk, Sławno, Koszalin, Białogard, Stargard, Szczecin Dąbie</textarea>
            </div>
            <div style="display: flex; gap: 15px; width: 100%;">
                <div class="input-group">
                    <label for="operatorInput">Przewoźnik:</label>
                    <input type="text" id="operatorInput" value="PKP Intercity">
                </div>
                <div class="input-group">
                    <label for="trainNameInput">Nazwa pociągu:</label>
                    <input type="text" id="trainNameInput" value="IC Albatros">
                </div>
            </div>
        </div>

        <button class="download-btn" onclick="downloadImage()">Pobierz jako PNG</button>
    </div>

    <!-- Główne płótno -->
    <div class="canvas-container" onclick="openModal()">
        <canvas id="boardCanvas"></canvas>
    </div>

    <!-- Okno modalne -->
    <div id="modalOverlay" class="modal-overlay" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeModal()">Zamknij X</button>
            <canvas id="modalCanvas"></canvas>
            <div style="margin-top:20px; color:#aaa; font-size:13px; text-align:center;">
                Zrób zrzut ekranu (PrintScreen).<br>Kliknij X lub w tło, aby zamknąć.
            </div>
        </div>
    </div>

    <script>
        // Inicjalizacja Płócien
        const canvas = document.getElementById('boardCanvas');
        const ctx = canvas.getContext('2d');
        const modalCanvas = document.getElementById('modalCanvas');
        const modalCtx = modalCanvas.getContext('2d');
        const modalOverlay = document.getElementById('modalOverlay');

        // Zmienna trybu pracy
        let currentMode = 'bus'; // 'bus' lub 'train'

        // Pobieranie elementów DOM (Autobus)
        const lineInput = document.getElementById('lineInput');
        const destInputBus = document.getElementById('destInputBus');
        const colorInput = document.getElementById('colorInput');
        
        // Pobieranie elementów DOM (Kolej)
        const timeInput = document.getElementById('timeInput');
        const destInputTrain = document.getElementById('destInputTrain');
        const viaInput = document.getElementById('viaInput');
        const operatorInput = document.getElementById('operatorInput');
        const trainNameInput = document.getElementById('trainNameInput');

        let lastValidLineText = lineInput.value;

        // Funkcja przełączająca tryb
        function setMode(mode) {
            currentMode = mode;
            
            // Stylizacja przycisków
            document.getElementById('btnBus').className = mode === 'bus' ? 'mode-btn active-bus' : 'mode-btn';
            document.getElementById('btnTrain').className = mode === 'train' ? 'mode-btn active-train' : 'mode-btn';

            // Pokaż/Ukryj formularze
            document.getElementById('controlsBus').style.display = mode === 'bus' ? 'flex' : 'none';
            document.getElementById('controlsTrain').style.display = mode === 'train' ? 'flex' : 'none';

            // Dostosowanie rozmiarów płótna
            if (mode === 'bus') {
                canvas.width = 1000; canvas.height = 250;
                canvas.style.aspectRatio = "4 / 1";
                modalCanvas.width = 1000; modalCanvas.height = 250;
                modalCanvas.style.aspectRatio = "4 / 1";
            } else {
                canvas.width = 1000; canvas.height = 500;
                canvas.style.aspectRatio = "2 / 1";
                modalCanvas.width = 1000; modalCanvas.height = 500;
                modalCanvas.style.aspectRatio = "2 / 1";
            }
            
            drawBoard();
        }

        // Funkcja pomocnicza do zawijania tekstu (Kolej)
        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split(/(?=[,\s])/); // dzieli po spacjach i przecinkach, zachowując je
            let line = '';
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n];
                let metrics = context.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    context.fillText(line.trim(), x, y);
                    line = words[n];
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line.trim(), x, y);
        }

        // Główna funkcja rysująca
        function drawToContext(targetCtx) {
            if (currentMode === 'bus') {
                // --- TRYB: AUTOBUS ---
                const lineText = lineInput.value;
                const destText = destInputBus.value.toUpperCase();
                const ledColor = colorInput.value;

                // Tło
                targetCtx.fillStyle = '#0a0a0a';
                targetCtx.fillRect(0, 0, 1000, 250);

                // Tekst z efektem świecenia
                targetCtx.fillStyle = ledColor;
                targetCtx.shadowColor = ledColor;
                targetCtx.shadowBlur = 15; 
                targetCtx.textBaseline = 'middle';

                // Linia
                targetCtx.font = 'bold 110px "DotGothic16", monospace';
                targetCtx.textAlign = 'center';
                targetCtx.fillText(lineText, 110, 250 / 2 + 5);

                // Kierunek
                targetCtx.font = '110px "DotGothic16", monospace';
                targetCtx.textAlign = 'center'; 
                targetCtx.fillText(destText, 580, 250 / 2 + 5);

                // Siatka LED
                targetCtx.shadowBlur = 0;
                targetCtx.fillStyle = '#000000';
                for (let y = 0; y < 250; y += 7) targetCtx.fillRect(0, y, 1000, 2);
                for (let x = 0; x < 1000; x += 7) targetCtx.fillRect(x, 0, 2, 250);

            } else {
                // --- TRYB: KOLEJ (PKP) ---
                const bgBlue = '#1e5088';
                
                // Tło
                targetCtx.fillStyle = bgBlue;
                targetCtx.fillRect(0, 0, 1000, 500);
                
                // Reset cieni
                targetCtx.shadowBlur = 0; 

                // Pionowa linia oddzielająca
                targetCtx.fillStyle = '#ffffff';
                targetCtx.fillRect(260, 20, 3, 460);

                targetCtx.fillStyle = '#ffffff';
                targetCtx.textBaseline = 'top';

                // --- LEWA KOLUMNA ---
                // Godzina
                targetCtx.font = 'bold 85px Arial, sans-serif';
                targetCtx.textAlign = 'center';
                targetCtx.fillText(timeInput.value, 130, 80);

                // Etykieta Przewoźnika
                targetCtx.font = 'italic 16px Arial, sans-serif';
                targetCtx.fillText("Przewoźnik / Operator", 130, 420);
                
                // Przewoźnik
                targetCtx.font = 'bold 24px Arial, sans-serif';
                targetCtx.fillText(operatorInput.value, 130, 445);

                // --- PRAWA KOLUMNA ---
                targetCtx.textAlign = 'left';

                // Stacja docelowa Etykieta
                targetCtx.font = 'italic 18px Arial, sans-serif';
                targetCtx.fillText("Stacja docelowa / Destination:", 285, 30);
                
                // Stacja docelowa Główny napis
                targetCtx.font = 'bold 75px Arial, sans-serif';
                targetCtx.fillText(destInputTrain.value, 285, 60);

                // Stacje pośrednie Etykieta
                targetCtx.font = 'italic 18px Arial, sans-serif';
                targetCtx.fillText("Stacje pośrednie / Via stations:", 285, 170);

                // Stacje pośrednie Zawijany tekst
                targetCtx.font = 'bold 26px Arial, sans-serif';
                wrapText(targetCtx, viaInput.value, 285, 205, 690, 36);

                // Etykieta Nazwy Pociągu (Lewy dół prawej kolumny)
                targetCtx.font = 'italic 18px Arial, sans-serif';
                targetCtx.fillText("Nazwa / Name", 285, 420);

                // Nazwa Pociągu
                targetCtx.font = 'bold 26px Arial, sans-serif';
                targetCtx.fillText(trainNameInput.value, 285, 445);
            }
        }

        function drawBoard() {
            drawToContext(ctx);
            drawToContext(modalCtx);
        }

        // --- NASŁUCHIWANIE ZMIAN ---
        // Autobus
        lineInput.addEventListener('input', function() {
            if (lineInput.value.length > 3) lineInput.value = lineInput.value.substring(0, 3);
            ctx.font = 'bold 110px "DotGothic16", monospace';
            if (ctx.measureText(lineInput.value).width > 200) {
                lineInput.value = lastValidLineText;
            } else {
                lastValidLineText = lineInput.value;
                drawBoard();
            }
        });
        destInputBus.addEventListener('input', drawBoard);
        colorInput.addEventListener('input', drawBoard);

        // Kolej
        timeInput.addEventListener('input', drawBoard);
        destInputTrain.addEventListener('input', drawBoard);
        viaInput.addEventListener('input', drawBoard);
        operatorInput.addEventListener('input', drawBoard);
        trainNameInput.addEventListener('input', drawBoard);

        // --- MODAL ---
        function openModal() {
            modalOverlay.style.display = 'flex';
            drawToContext(modalCtx);
        }

        function closeModal() {
            modalOverlay.style.display = 'none';
        }

        // --- POBIERANIE ---
        function downloadImage() {
            canvas.toBlob(function(blob) {
                if (!blob) return alert("Błąd generowania obrazu.");
                
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                
                let fileName = "";
                if (currentMode === 'bus') {
                    const safeLine = lineInput.value.replace(/[^a-zA-Z0-9]/g, '');
                    const safeDest = destInputBus.value.replace(/[^a-zA-Z0-9\sąćęłńóśźżĄĆĘŁŃÓŚŹŻ]/g, '').trim().replace(/\s+/g, '_');
                    fileName = `autobus_${safeLine}_${safeDest}.png`;
                } else {
                    const safeDest = destInputTrain.value.replace(/[^a-zA-Z0-9\sąćęłńóśźżĄĆĘŁŃÓŚŹŻ]/g, '').trim().replace(/\s+/g, '_');
                    fileName = `kolej_${safeDest}.png`;
                }
                
                link.download = fileName;
                link.href = url;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            }, 'image/png');
        }

        // --- START APLIKACJI ---
        setMode('bus'); // Ustawia domyślny tryb i wywołuje drawBoard()
        
        // Zapewnienie, że czcionka autobusowa wczyta się prawidłowo
        document.fonts.ready.then(() => {
            if(currentMode === 'bus') drawBoard();
        });
    </script>
</body>
</html>
