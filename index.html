<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Generator Tablic Informacyjnych</title>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            margin: 0;
            min-height: 100vh;
        }

        h1 {
            margin-top: 5px;
            color: #f1c40f;
            font-size: 24px;
            text-align: center;
        }

        /* --- WYBÓR GŁÓWNEGO TRYBU --- */
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            width: 100%;
            max-width: 700px;
        }

        .mode-btn {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            background-color: #1e1e1e;
            color: #aaa;
            border: 2px solid #333;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-btn.active-bus {
            background-color: #d35400;
            color: white;
            border-color: #e67e22;
        }

        .mode-btn.active-train {
            background-color: #1e5088;
            color: white;
            border-color: #2b74c2;
        }

        /* --- PODKATEGORIE AUTOBUSÓW --- */
        .sub-mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 700px;
        }

        .sub-mode-btn {
            flex: 1;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            background-color: #1e1e1e;
            color: #888;
            border: 1px solid #444;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sub-mode-btn.active {
            background-color: #e67e22;
            color: white;
            border-color: #d35400;
        }

        /* --- KONTROLKI --- */
        .controls-container {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            width: 100%;
            max-width: 700px;
            box-sizing: border-box;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 120px;
            width: 100%;
        }

        label {
            font-size: 13px;
            font-weight: bold;
            color: #aaa;
        }

        input[type="text"], input[type="color"], textarea {
            background-color: #2c2c2c;
            color: white;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 5px;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }

        input[type="color"] {
            height: 45px;
            padding: 2px;
            cursor: pointer;
        }

        /* Specjalne rzędy dla SIP */
        .sip-row {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 5px;
        }
        .sip-l { flex: 0.5; text-align: center; font-weight: bold; }
        .sip-d { flex: 2; }
        .sip-t { flex: 1; text-align: right; }
        
        .section-title {
            width: 100%;
            font-size: 14px;
            color: #e67e22;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        button.download-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-top: 15px;
        }

        button.download-btn:hover {
            background-color: #2ecc71;
        }

        /* --- PŁÓTNO (CANVAS) --- */
        .canvas-container {
            width: 100%;
            max-width: 900px;
            position: relative;
            cursor: pointer;
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .canvas-container::after {
            content: "Kliknij tablicę, aby powiększyć do zrzutu ekranu";
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            color: #ddd;
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 15px;
            pointer-events: none;
            white-space: nowrap;
        }

        canvas {
            background-color: #000;
            border: 4px solid #1a1a1a;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            width: 100%;
            height: auto;
            display: block;
            transition: aspect-ratio 0.3s;
        }

        /* --- MODAL --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
        }

        .modal-content {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .close-modal {
            background: #c0392b;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 15px;
            align-self: flex-end;
            width: auto;
        }
    </style>
</head>
<body>

    <h1>Generator Tablic Informacyjnych</h1>

    <!-- Główne kategorie -->
    <div class="mode-selector">
        <div class="mode-btn active-bus" id="btnBus" onclick="setMainMode('bus')">🚌 Autobus</div>
        <div class="mode-btn" id="btnTrain" onclick="setMainMode('train')">🚆 Kolej (PKP)</div>
    </div>

    <!-- Podkategorie dla autobusów -->
    <div class="sub-mode-selector" id="subModeBus">
        <div class="sub-mode-btn active" id="btnBusDir" onclick="setSubMode('dir')">Tablica Kierunkowa (Pojazd)</div>
        <div class="sub-mode-btn" id="btnBusSip" onclick="setSubMode('sip')">System Informacji Dynamicznej (Przystanek)</div>
    </div>

    <!-- Kontrolki -->
    <div class="controls-container">
        
        <!-- 1. Tablica Kierunkowa Autobusu (Klasyczna LED) -->
        <div id="controlsBusDir" class="controls">
            <div class="input-group">
                <label for="lineInput">Linia (max 3 cyfry):</label>
                <input type="text" id="lineInput" value="123" maxlength="3">
            </div>
            <div class="input-group" style="flex: 2;">
                <label for="destInputBus">Kierunek:</label>
                <input type="text" id="destInputBus" value="DWORZEC GŁÓWNY">
            </div>
            <div class="input-group" style="min-width: 60px; flex: 0.5;">
                <label for="colorInput">Kolor:</label>
                <input type="color" id="colorInput" value="#ff9900">
            </div>
        </div>

        <!-- 2. System Informacji Pasażerskiej (Przystanek) -->
        <div id="controlsBusSip" class="controls" style="display: none;">
            <div style="display: flex; gap: 10px; width: 100%;">
                <div class="input-group" style="flex: 2;">
                    <label>Nazwa przystanku:</label>
                    <input type="text" id="sipStopName" value="Fieldorfa-Nila">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Zegar:</label>
                    <input type="text" id="sipTime" value="05:53">
                </div>
            </div>
            
            <div class="section-title">Odjazdy:</div>
            
            <!-- 4 rzędy odjazdów -->
            <div class="sip-row">
                <input type="text" id="sipL1" value="1" class="sip-l" placeholder="Linia">
                <input type="text" id="sipD1" value="Wieprzyce PKP" class="sip-d" placeholder="Kierunek">
                <input type="text" id="sipT1" value="5 min" class="sip-t" placeholder="Czas">
            </div>
            <div class="sip-row">
                <input type="text" id="sipL2" value="4" class="sip-l">
                <input type="text" id="sipD2" value="Dworzec Główny" class="sip-d">
                <input type="text" id="sipT2" value="9 min" class="sip-t">
            </div>
            <div class="sip-row">
                <input type="text" id="sipL3" value="3" class="sip-l">
                <input type="text" id="sipD3" value="Piaski" class="sip-d">
                <input type="text" id="sipT3" value="13 min" class="sip-t">
            </div>
            <div class="sip-row">
                <input type="text" id="sipL4" value="1" class="sip-l">
                <input type="text" id="sipD4" value="Wieprzyce PKP" class="sip-d">
                <input type="text" id="sipT4" value="25 min" class="sip-t">
            </div>

            <div class="input-group">
                <label>Pasek informacyjny (Dół):</label>
                <input type="text" id="sipTicker" value="Jakość powietrza bardzo dobra =)">
            </div>
        </div>

        <!-- 3. Tablica Kolejowa -->
        <div id="controlsTrain" class="controls" style="display: none;">
            <div style="display: flex; gap: 15px; width: 100%;">
                <div class="input-group" style="flex: 1;">
                    <label for="timeInput">Godzina:</label>
                    <input type="text" id="timeInput" value="4:58">
                </div>
                <div class="input-group" style="flex: 3;">
                    <label for="destInputTrain">Stacja docelowa:</label>
                    <input type="text" id="destInputTrain" value="Szczecin Główny">
                </div>
            </div>
            <div class="input-group">
                <label for="viaInput">Stacje pośrednie (rozdzielone przecinkami):</label>
                <textarea id="viaInput">Sopot, Gdynia Główna, Rumia, Wejherowo, Lębork, Słupsk, Sławno, Koszalin, Białogard, Stargard, Szczecin Dąbie</textarea>
            </div>
            <div style="display: flex; gap: 15px; width: 100%;">
                <div class="input-group">
                    <label for="operatorInput">Przewoźnik:</label>
                    <input type="text" id="operatorInput" value="PKP Intercity">
                </div>
                <div class="input-group">
                    <label for="trainNameInput">Nazwa pociągu:</label>
                    <input type="text" id="trainNameInput" value="IC Albatros">
                </div>
            </div>
        </div>

        <button class="download-btn" onclick="downloadImage()">Pobierz jako PNG</button>
    </div>

    <!-- Główne płótno -->
    <div class="canvas-container" onclick="openModal()">
        <canvas id="boardCanvas"></canvas>
    </div>

    <!-- Okno modalne -->
    <div id="modalOverlay" class="modal-overlay" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeModal()">Zamknij X</button>
            <canvas id="modalCanvas"></canvas>
            <div style="margin-top:20px; color:#aaa; font-size:13px; text-align:center;">
                Zrób zrzut ekranu (PrintScreen).<br>Kliknij X lub w tło, aby zamknąć.
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('boardCanvas');
        const ctx = canvas.getContext('2d');
        const modalCanvas = document.getElementById('modalCanvas');
        const modalCtx = modalCanvas.getContext('2d');
        const modalOverlay = document.getElementById('modalOverlay');

        let currentMainMode = 'bus'; 
        let currentSubMode = 'dir'; 

        // Funkcje Przełączania Trybów
        function setMainMode(mode) {
            currentMainMode = mode;
            document.getElementById('btnBus').className = mode === 'bus' ? 'mode-btn active-bus' : 'mode-btn';
            document.getElementById('btnTrain').className = mode === 'train' ? 'mode-btn active-train' : 'mode-btn';
            document.getElementById('subModeBus').style.display = mode === 'bus' ? 'flex' : 'none';
            updateUI();
        }

        function setSubMode(mode) {
            currentSubMode = mode;
            document.getElementById('btnBusDir').className = mode === 'dir' ? 'sub-mode-btn active' : 'sub-mode-btn';
            document.getElementById('btnBusSip').className = mode === 'sip' ? 'sub-mode-btn active' : 'sub-mode-btn';
            updateUI();
        }

        function updateUI() {
            // Ukryj wszystkie
            document.getElementById('controlsBusDir').style.display = 'none';
            document.getElementById('controlsBusSip').style.display = 'none';
            document.getElementById('controlsTrain').style.display = 'none';

            let targetRatio, w, h;

            if (currentMainMode === 'train') {
                document.getElementById('controlsTrain').style.display = 'flex';
                w = 1000; h = 500; targetRatio = "2 / 1";
            } else {
                if (currentSubMode === 'dir') {
                    document.getElementById('controlsBusDir').style.display = 'flex';
                    w = 1000; h = 250; targetRatio = "4 / 1";
                } else {
                    document.getElementById('controlsBusSip').style.display = 'flex';
                    w = 1000; h = 580; targetRatio = "1000 / 580";
                }
            }

            canvas.width = w; canvas.height = h; canvas.style.aspectRatio = targetRatio;
            modalCanvas.width = w; modalCanvas.height = h; modalCanvas.style.aspectRatio = targetRatio;
            drawBoard();
        }

        // Pomocnicze zawijanie tekstu dla PKP
        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split(/(?=[,\s])/); 
            let line = '';
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n];
                let metrics = context.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    context.fillText(line.trim(), x, y);
                    line = words[n];
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line.trim(), x, y);
        }

        // Rysowanie na płótnie
        function drawToContext(targetCtx) {
            if (currentMainMode === 'train') {
                // --- TRYB: KOLEJ (PKP) ---
                
                // Prawe, jaśniejsze tło
                targetCtx.fillStyle = '#1e5088';
                targetCtx.fillRect(0, 0, 1000, 500);

                // Lewe, ciemniejsze tło (Nowość!)
                targetCtx.fillStyle = '#11355e';
                targetCtx.fillRect(0, 0, 260, 500);
                
                targetCtx.shadowBlur = 0; 
                targetCtx.fillStyle = '#ffffff';
                targetCtx.fillRect(260, 20, 3, 460); // Pionowa biała linia
                targetCtx.textBaseline = 'top';

                // --- LEWA KOLUMNA (Ciemniejsza) ---
                targetCtx.font = 'bold 85px Arial, sans-serif';
                targetCtx.textAlign = 'center';
                targetCtx.fillText(document.getElementById('timeInput').value, 130, 80);
                targetCtx.font = 'italic 16px Arial, sans-serif';
                targetCtx.fillText("Przewoźnik / Operator", 130, 420);
                targetCtx.font = 'bold 24px Arial, sans-serif';
                targetCtx.fillText(document.getElementById('operatorInput').value, 130, 445);

                // --- PRAWA KOLUMNA (Jaśniejsza) ---
                targetCtx.textAlign = 'left';
                targetCtx.font = 'italic 18px Arial, sans-serif';
                targetCtx.fillText("Stacja docelowa / Destination:", 285, 30);
                targetCtx.font = 'bold 75px Arial, sans-serif';
                targetCtx.fillText(document.getElementById('destInputTrain').value, 285, 60);
                targetCtx.font = 'italic 18px Arial, sans-serif';
                targetCtx.fillText("Stacje pośrednie / Via stations:", 285, 170);
                targetCtx.font = 'bold 26px Arial, sans-serif';
                wrapText(targetCtx, document.getElementById('viaInput').value, 285, 205, 690, 36);
                targetCtx.font = 'italic 18px Arial, sans-serif';
                targetCtx.fillText("Nazwa / Name", 285, 420);
                targetCtx.font = 'bold 26px Arial, sans-serif';
                targetCtx.fillText(document.getElementById('trainNameInput').value, 285, 445);

            } else if (currentSubMode === 'dir') {
                // --- TRYB: AUTOBUS KIERUNKOWY (POJAZD) ---
                const ledColor = document.getElementById('colorInput').value;
                targetCtx.fillStyle = '#0a0a0a';
                targetCtx.fillRect(0, 0, 1000, 250);
                targetCtx.fillStyle = ledColor;
                targetCtx.shadowColor = ledColor;
                targetCtx.shadowBlur = 15; 
                targetCtx.textBaseline = 'middle';
                targetCtx.font = 'bold 110px "DotGothic16", monospace';
                targetCtx.textAlign = 'center';
                targetCtx.fillText(document.getElementById('lineInput').value, 110, 250 / 2 + 5);
                targetCtx.font = '110px "DotGothic16", monospace';
                targetCtx.textAlign = 'center'; 
                targetCtx.fillText(document.getElementById('destInputBus').value.toUpperCase(), 580, 250 / 2 + 5);

                // Siatka LED
                targetCtx.shadowBlur = 0;
                targetCtx.fillStyle = '#000000';
                for (let y = 0; y < 250; y += 7) targetCtx.fillRect(0, y, 1000, 2);
                for (let x = 0; x < 1000; x += 7) targetCtx.fillRect(x, 0, 2, 250);

            } else {
                // --- TRYB: AUTOBUS SIP (PRZYSTANEK) ---
                targetCtx.fillStyle = '#060606';
                targetCtx.fillRect(0, 0, 1000, 580);
                targetCtx.textBaseline = 'top';

                // Imitacja pikselowego Herbu/Logo w rogu
                targetCtx.shadowBlur = 0;
                targetCtx.fillStyle = '#ffffff';
                targetCtx.fillRect(35, 25, 70, 75); // Biała tarcza
                targetCtx.fillStyle = '#e74c3c';
                targetCtx.fillRect(45, 35, 50, 55); // Czerwony środek (orzeł)

                // Nazwa Przystanku (Jasnoniebieski/Cyjan)
                const cyan = '#42cbf5';
                targetCtx.fillStyle = cyan;
                targetCtx.shadowColor = cyan;
                targetCtx.shadowBlur = 10;
                targetCtx.textAlign = 'center';
                targetCtx.font = '65px "DotGothic16", monospace';
                targetCtx.fillText(document.getElementById('sipStopName').value, 500, 25);

                // Zegar (Pomarańczowy)
                const orange = '#ff9500';
                targetCtx.fillStyle = orange;
                targetCtx.shadowColor = orange;
                targetCtx.textAlign = 'right';
                targetCtx.font = '80px "DotGothic16", monospace';
                targetCtx.fillText(document.getElementById('sipTime').value, 970, 15);

                // Nagłówki kolumn (Niebieskie/Białawe)
                const headerCol = '#9dc6e8';
                targetCtx.fillStyle = headerCol;
                targetCtx.shadowColor = headerCol;
                targetCtx.font = '45px "DotGothic16", monospace';
                targetCtx.textAlign = 'left';
                targetCtx.fillText("Linia", 30, 130);
                targetCtx.fillText("Kierunek", 230, 130);
                targetCtx.textAlign = 'right';
                targetCtx.fillText("Odjazd", 970, 130);

                // 4 Rzędy odjazdów (Żółte)
                const yellow = '#ffcc00';
                targetCtx.fillStyle = yellow;
                targetCtx.shadowColor = yellow;
                targetCtx.font = '55px "DotGothic16", monospace';
                for (let i = 1; i <= 4; i++) {
                    let y = 145 + i * 65;
                    targetCtx.textAlign = 'center';
                    targetCtx.fillText(document.getElementById('sipL'+i).value, 80, y);
                    targetCtx.textAlign = 'left';
                    targetCtx.fillText(document.getElementById('sipD'+i).value, 230, y);
                    targetCtx.textAlign = 'right';
                    targetCtx.fillText(document.getElementById('sipT'+i).value, 970, y);
                }

                // Dolny pasek informacyjny (Zielony)
                const green = '#2ecc71';
                targetCtx.fillStyle = green;
                targetCtx.shadowColor = green;
                targetCtx.textAlign = 'center';
                targetCtx.font = '45px "DotGothic16", monospace';
                targetCtx.fillText(document.getElementById('sipTicker').value, 500, 505);

                // Nakładanie Siatki LED
                targetCtx.shadowBlur = 0;
                targetCtx.fillStyle = '#000000';
                for (let y = 0; y < 580; y += 5) targetCtx.fillRect(0, y, 1000, 2);
                for (let x = 0; x < 1000; x += 5) targetCtx.fillRect(x, 0, 2, 580);
            }
        }

        function drawBoard() {
            drawToContext(ctx);
            drawToContext(modalCtx);
        }

        // --- NASŁUCHIWANIE ZMIAN ---
        // Aktualizacja po wpisywaniu dla wszystkich trybów
        const inputs = document.querySelectorAll('input, textarea');
        inputs.forEach(input => {
            input.addEventListener('input', drawBoard);
        });

        // Dodatkowe zabezpieczenie długości dla tablicy pojazdu
        let lastValidLineText = "123";
        document.getElementById('lineInput').addEventListener('input', function(e) {
            if (currentMainMode === 'bus' && currentSubMode === 'dir') {
                if (e.target.value.length > 3) e.target.value = e.target.value.substring(0, 3);
            }
        });

        // --- MODAL ---
        function openModal() {
            modalOverlay.style.display = 'flex';
            drawToContext(modalCtx);
        }
        function closeModal() {
            modalOverlay.style.display = 'none';
        }

        // --- POBIERANIE ---
        function downloadImage() {
            canvas.toBlob(function(blob) {
                if (!blob) return alert("Błąd generowania obrazu.");
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                let fileName = "tablica.png";
                
                if (currentMainMode === 'train') {
                    const safeDest = document.getElementById('destInputTrain').value.replace(/[^a-zA-Z0-9]/g, '_');
                    fileName = `kolej_${safeDest}.png`;
                } else if (currentSubMode === 'dir') {
                    const safeLine = document.getElementById('lineInput').value.replace(/[^a-zA-Z0-9]/g, '');
                    fileName = `autobus_pojazd_${safeLine}.png`;
                } else {
                    const safeStop = document.getElementById('sipStopName').value.replace(/[^a-zA-Z0-9]/g, '_');
                    fileName = `autobus_przystanek_${safeStop}.png`;
                }
                
                link.download = fileName;
                link.href = url;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            }, 'image/png');
        }

        // Uruchomienie na start
        setMainMode('bus'); 
        document.fonts.ready.then(drawBoard);
    </script>
</body>
</html>
